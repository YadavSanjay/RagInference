# RagInference CI: lint, types, tests and the public-safety check. Tests inject stub models, so
# they run on a plain ubuntu runner with no torch and no model downloads.
name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

# Actions are pinned to commit SHAs (version in the trailing comment) and Python packages to exact
# versions in requirements-dev.txt; upgrade deliberately.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Install pinned dev deps
        run: pip install -r requirements-dev.txt
      - name: Public-safety check
        run: python scripts/check_public_safe.py
      - name: Ruff
        run: ruff check . --output-format github
      - name: Mypy
        run: mypy
      - name: Pytest
        run: python -m pytest test/ -q
