version: 1
disable_existing_loggers: false
formatters:
  detailed:
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    # stderr, never stdout — keeps the door open to embedding behind a stdio
    # transport without corrupting a JSON-RPC stream.
    stream: ext://sys.stderr
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/raginference.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8
loggers:
  src:
    level: INFO
    handlers: [console, file]
    propagate: false
root:
  level: INFO
  handlers: [console, file]
