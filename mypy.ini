; RagInference type-checking config.
;
;   conda run -n py312 mypy
;
; Suppressions are per-module, never global, and each says why. If the reason stops
; being true, delete the override.

[mypy]
python_version = 3.12
files = src, scripts, infra/download_models.py
explicit_package_bases = True
; Settings fields use validation aliases; without the plugin every one reads as required.
plugins = pydantic.mypy

; The model stack is lazy-imported by the wrappers and absent from the CI environment
; (tests inject stubs). Following torch locally also takes minutes.
[mypy-torch.*,transformers.*,FlagEmbedding.*,huggingface_hub.*]
ignore_missing_imports = True
follow_imports = skip

; boto3 ships no type stubs; it is confined to the S3Storage adapter.
[mypy-boto3.*,botocore.*]
ignore_missing_imports = True
